name: Build and test
on: [push, pull_request]
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: platformio run
      - run: c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I include src/transfer.cpp tests/transfer_test.cpp -o /tmp/janus-test && /tmp/janus-test
      - run: python -m unittest discover -s tests
